<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Fixed vs Fluid Container</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="container bg-primary text-white py-5 mt-3 text-center">
        <h2>Fixed Width Container (.container)</h2>
        <p>This section has a responsive fixed width based on screen size.</p>
    </div>

    
    <div class="container-fluid bg-danger text-white py-5 text-center mt-5">
        <h2>Full Width Container (.container-fluid)</h2>
        <p>This section takes the full width of the screen.</p>
    </div>



</body>
</html>
